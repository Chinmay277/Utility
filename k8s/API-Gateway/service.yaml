apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: uvision
spec:
  type: NodePort                # Browser-accessible
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080               # Internal cluster port
      targetPort: 8080         # Container port
      nodePort: 30080          # External port to access via browser
