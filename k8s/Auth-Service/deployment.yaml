apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: uvision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 9091
          envFrom:
            - secretRef:
                name: auth-db-secret
            - secretRef:
                name: shared-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: dockerhub-creds
